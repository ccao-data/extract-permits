[project]
name = "chicago-permits"
version = "0.0.1"
description = "Extract process for Chicago permits"
requires-python = ">=3.12"
dependencies = [
  "requests==2.34.*",
  "pandas==3.1.*",
  "PyAthena==4.2.*",
  "XlsxWriter==3.3.*",
  "openpyxl==3.1.*",
]

[tool.ruff]
# Default is 88
line-length = 79

[tool.ruff.lint]
# Enable isort
extend-select = ["I"]
